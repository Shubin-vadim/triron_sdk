name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create GitHub Release
  id-token: write # Trusted Publishing to PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi # must match the environment registered on PyPI
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12.4"
          enable-cache: true

      - name: Read version from pyproject.toml
        id: meta
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject version
        run: test "v${{ steps.meta.outputs.version }}" = "${{ github.ref_name }}"

      - name: Build distributions
        run: uv build --no-sources --out-dir dist

      - name: Sanity-check build artifacts
        run: |
          ls -la dist/
          test -f "dist/triton_inference_sdk-${{ steps.meta.outputs.version }}.tar.gz"

      - name: Check if version is already on PyPI
        id: pypi
        run: |
          if curl -sfI "https://pypi.org/project/triton-inference-sdk/${{ steps.meta.outputs.version }}/" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.meta.outputs.version }} already on PyPI; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        run: uv publish dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
