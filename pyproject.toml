[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triton_sdk*"]
exclude = ["triton_sdk.tests*"]

[tool.setuptools.package-data]
triton_sdk = ["py.typed"]

[project]
name = "triton-sdk"
version = "0.1.0"
description = "Python SDK for NVIDIA Triton Inference Server focused on LLM workloads (TensorRT-LLM, vLLM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx~=0.28.1",
    "pydantic~=2.12.3",
    "pydantic-settings~=2.12.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.66", "protobuf>=5.28"]
chat = ["transformers>=4.45", "jinja2~=3.1.6"]
all = ["triton-sdk[grpc,chat]"]

[dependency-groups]
dev = [
    "colorlog~=6.10.1",
    "grpcio-tools>=1.66",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "python-dotenv>=1.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.3",
    "types-protobuf>=5.28",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["triton_sdk/transport/protos", "monitoring"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", "ANN201", "ANN401", "ANN002", "ANN003", "C90", "CPY", "COM812", "ERA", "FIX002",
    "ISC001", "PERF203", "PLR09", "RUF012", "TD002", "TD003", "TRY301", "PLC0415", "PLW1641",
    # SDK-specific: relative imports inside the package, interface stubs with unused args,
    # explicit timeout= parameters in the public async API, no TYPE_CHECKING gymnastics for pydantic models
    "TID252", "ARG002", "ASYNC109", "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"triton_sdk/tests/*" = ["S101", "SLF001"]
"examples/*" = ["T201", "INP001"]
"scripts/*" = ["T201", "INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
pretty = true
show_error_codes = true
exclude = ["triton_sdk/transport/protos/"]

[[tool.mypy.overrides]]
module = ["triton_sdk.transport.protos.*", "grpc.*", "transformers.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["triton_sdk/tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running Triton Inference Server (see docker-compose.yml)",
]
